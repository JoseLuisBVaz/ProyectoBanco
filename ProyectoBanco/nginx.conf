server {
    listen 80;
    server_name tu-dominio.com;  # Cambiar por tu dominio o IP
    
    # Servir el frontend (Angular compilado)
    root /ruta/completa/ProyectoBanco/ProyectoBanco/dist/ProyectoBanco/browser;
    index index.html;

    # Configuración para Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend (API)
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/banco-jety-access.log;
    error_log /var/log/nginx/banco-jety-error.log;
}
